# SEED OS — local/self-hosted stack: API, worker, sandbox, Postgres, web.
name: seed
x-seed-env: &seed-env
  SEED_COOKIE_SECURE: ${SEED_COOKIE_SECURE:-false}
  SEED_DATABASE_URL: postgresql://seed:${SEED_POSTGRES_PASSWORD:?set SEED_POSTGRES_PASSWORD in .env}@db:5432/seed
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seed
      POSTGRES_DB: seed
      POSTGRES_PASSWORD: ${SEED_POSTGRES_PASSWORD:?set SEED_POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seed -d seed"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
  api:
    build: ./backend
    env_file: .env
    environment: *seed-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
  worker:
    build: ./backend
    command: ["python", "-m", "seed_api.flow.worker"]
    env_file: .env
    environment:
      <<: *seed-env
      SEED_SANDBOX_URL: http://sandbox:8100
      SEED_ARTIFACT_ROOT: /var/lib/seed/artifacts
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    # Commands and task files go through the sandbox, never the worker's own disk.
    networks: [default, sandbox]
    # Saved task files (ADR-0014); only the worker writes them.
    volumes:
      - artifacts:/var/lib/seed/artifacts
    # The worker hands its task back on SIGTERM; give it time to do so.
    stop_grace_period: 30s
    healthcheck:
      disable: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
  sandbox:
    build: ./backend
    # asyncio loop: uvloop cannot start a subprocess as another user.
    command: ["uvicorn", "seed_api.sandbox.server:app", "--host", "0.0.0.0", "--port", "8100", "--loop", "asyncio"]
    restart: unless-stopped
    # No env_file: the sandbox holds no secrets and no database credentials.
    # Root inside the container only to give each task its own user; every other
    # capability is dropped and the root filesystem is read-only.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      # Workspaces are scratch space, bounded in size; their files are saved as
      # artifacts after each run and put back after a restart (ADR-0014).
      - /workspaces:size=256m,mode=0711
    # Only on the internal network: reachable by the worker, no route out.
    networks: [sandbox]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SEED_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    mem_limit: 64m
networks:
  sandbox:
    internal: true
volumes:
  pgdata:
  artifacts:
