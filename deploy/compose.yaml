# Production compose file for the VPS. The deploy workflow copies it to DEPLOY_PATH
# (/opt/seed), sets SEED_TAG in .env and runs `docker compose pull && up -d`.
# Adapted from stephenvidal/dustline (deploy/docker-compose.yml).
#
# Public traffic: a Cloudflare tunnel on the host maps the public hostname to
# http://127.0.0.1:${SEED_HOST_PORT}. Cloudflare terminates TLS, so cookies are Secure.
#
# Postgres data lives in the named volume `seed_pgdata`; it survives redeploys.
# The deploy job refuses to run unless .env sets SEED_POSTGRES_PASSWORD.
name: seed
x-seed-env: &seed-env
  SEED_COOKIE_SECURE: "true"
  SEED_DATABASE_URL: postgresql://seed:${SEED_POSTGRES_PASSWORD:?set SEED_POSTGRES_PASSWORD in .env}@db:5432/seed
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seed
      POSTGRES_DB: seed
      POSTGRES_PASSWORD: ${SEED_POSTGRES_PASSWORD:?set SEED_POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seed -d seed"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports: only the api and worker reach it, on the compose network.
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  api:
    image: ghcr.io/stephenvidal/seed-api:${SEED_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment: *seed-env
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    logging: *logging
  worker:
    image: ghcr.io/stephenvidal/seed-api:${SEED_TAG:-latest}
    command: ["python", "-m", "seed_api.flow.worker"]
    # Exits at start when no model provider is configured; don't crash-loop on that.
    restart: on-failure:5
    env_file:
      - path: .env
        required: true
    environment:
      <<: *seed-env
      SEED_SANDBOX_URL: http://sandbox:8100
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    # Commands and task files go through the sandbox, never the worker's own disk.
    networks: [default, sandbox]
    # The worker hands its task back on SIGTERM; give it time to do so.
    stop_grace_period: 30s
    healthcheck:
      disable: true
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    logging: *logging
  sandbox:
    image: ghcr.io/stephenvidal/seed-api:${SEED_TAG:-latest}
    # asyncio loop: uvloop cannot start a subprocess as another user.
    command: ["uvicorn", "seed_api.sandbox.server:app", "--host", "0.0.0.0", "--port", "8100", "--loop", "asyncio"]
    restart: unless-stopped
    # No env_file: the sandbox holds no secrets and no database credentials.
    # Root inside the container only to give each task its own user; every other
    # capability is dropped and the root filesystem is read-only.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      # Workspaces are ephemeral until artifact storage (M6), and bounded in size.
      - /workspaces:size=256m,mode=0711
    # Only on the internal network: reachable by the worker, no route out.
    networks: [sandbox]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging: *logging
  web:
    image: ghcr.io/stephenvidal/seed-web:${SEED_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Loopback only. Host ports 8080 (filebrowser) and 8090 (dustline) are taken.
    ports:
      - "127.0.0.1:${SEED_HOST_PORT:-8091}:8080"
    mem_limit: 64m
    logging: *logging
networks:
  sandbox:
    internal: true
volumes:
  pgdata:
