server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

  # Long read timeout for SSE runs (the API also sends keepalives every 15s).
  location /api/ { proxy_read_timeout 600s; proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  # Studio previews (ADR-0015) are framed by the app and carry their own sandboxing
  # CSP from the API. add_header here replaces the server-level headers, whose
  # frame-ancestors 'none', X-Frame-Options and second CSP would block or narrow them.
  location /api/v1/previews/ { proxy_pass http://api:8000; proxy_set_header Host $host; add_header X-Content-Type-Options nosniff always; }
  location = /healthz { proxy_pass http://api:8000; }
  # add_header in a location replaces server-level headers, so repeat nosniff here.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; }
  location / { try_files $uri /index.html; }
}
