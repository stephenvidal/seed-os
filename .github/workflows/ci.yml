# CI on GitHub-hosted runners. The repository is public, so standard runners are
# unmetered; while it was private this account's spending limit blocked hosted
# minutes outright and checks ran on a self-hosted golden-eye runner instead. That
# box is a 4-vCPU Pentium with no AVX, which is where the container-based steps in
# the earlier revision came from — they are gone now that hosted runners are back.
#
# Rules: keep the fork guard (fork PRs must never execute checks that later grow
# secrets), keep timeout-minutes, keep cancel-in-progress.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Public repository: anyone can open a fork PR. Only build PRs whose head is
    # this repository; a fork PR gets reviewed by hand before anything runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seed
          POSTGRES_PASSWORD: seed-ci-only
          POSTGRES_DB: seed_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seed -d seed_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Backend checks
        working-directory: backend
        env:
          # Throwaway CI database; the DB tests fail (not skip) if it is unreachable.
          SEED_TEST_DATABASE_URL: postgresql://seed:seed-ci-only@localhost:5432/seed_test
          SEED_REQUIRE_DB_TESTS: "1"
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy
          .venv/bin/pytest -q
      - name: Sandbox per-task user tests (need root, as in the sandbox container)
        working-directory: backend
        env:
          SEED_REQUIRE_ROOT_TESTS: "1"
        # Task users run the venv's Python for file operations, so they must be able
        # to reach it; the runner's home is 0750 by default.
        run: |
          sudo chmod o+x "$HOME"
          sudo -E .venv/bin/pytest -q -p no:cacheprovider tests/test_sandbox.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Build images (not pushed)
        run: |
          docker build -t seed-api:ci backend
          docker build -t seed-web:ci frontend

      - name: Sandbox container isolation check
        env:
          SEED_POSTGRES_PASSWORD: ci-unused
        run: |
          touch .env
          docker compose up -d --wait sandbox
          docker compose exec -T sandbox python - < backend/scripts/sandbox_smoke.py
          docker compose down
