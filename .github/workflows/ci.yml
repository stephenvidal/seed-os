# Runs on a self-hosted runner on golden-eye (labels: self-hosted, golden-eye).
# GitHub-hosted minutes for private repos are blocked by this account's spending
# limit, so CI runs on our own hardware. Pattern borrowed from stephenvidal/dustline
# (docs/CI.md there). Rules: keep runs-on, keep the fork guard, keep timeouts.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: [self-hosted, golden-eye]
    timeout-minutes: 25
    # A self-hosted runner executes whatever the workflow says: never run fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # Backend checks run in the same base image as production. setup-python's
      # prebuilt CPython needs a newer CPU ISA than golden-eye has ("CPU ISA level
      # is lower than required"). The source is copied in read-only so the
      # container (root) never leaves root-owned files in the runner workspace.
      - name: Backend checks
        run: |
          docker run --rm -v "$PWD/backend:/src:ro" python:3.13-slim sh -euc '
            cp -r /src /work && cd /work
            pip install -q --root-user-action=ignore -e ".[dev]"
            ruff check .
            ruff format --check .
            mypy
            pytest -q -p no:cacheprovider
          '

      # Same approach for the frontend: setup-node's tool-cache write took minutes
      # on golden-eye and the run was cut off there. node:22-alpine is the web build image.
      - name: Frontend checks
        run: |
          docker run --rm -v "$PWD/frontend:/src:ro" node:22-alpine sh -euc '
            mkdir /work && cd /src && cp -r $(ls -A | grep -vx node_modules) /work/ && cd /work
            npm ci --no-audit --no-fund
            npm run typecheck
            npm run lint
            npm run format:check
            npm test
            npm run build
          '

      - name: Build images (not pushed)
        run: |
          docker build -t seed-api:ci backend
          docker build -t seed-web:ci frontend
